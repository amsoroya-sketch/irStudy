# Redis Configuration for irStudy Platform
# Memory: 2.5 GB (512 MB EMR + 2 GB AI OSCE)
# Namespaces: emr:* (cache, TTL-based) and osce:* (sessions, persistent)

# Memory Configuration
maxmemory 2560mb
maxmemory-policy allkeys-lru

# Persistence (RDB Snapshots)
save 900 1       # Save after 15 min if ≥1 key changed
save 300 10      # Save after 5 min if ≥10 keys changed
save 60 10000    # Save after 1 min if ≥10,000 keys changed

# AOF (Append-Only File) for durability
appendonly yes
appendfsync everysec

# Security
# Password will be managed by Vault (secret/ai-osce/redis-password)
# requirepass managed-by-vault

# Network
bind 127.0.0.1 ::1
protected-mode yes

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Logging
loglevel notice
