name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: |
          cd backend
          mkdir -p security_reports
          bandit -r src/ -f json -o security_reports/bandit_report.json || true
          bandit -r src/ -f txt
      
      - name: Check for HIGH/CRITICAL issues
        run: |
          cd backend
          if [ -f security_reports/bandit_report.json ]; then
            python3 -c "import json; data=json.load(open('security_reports/bandit_report.json')); high_crit=[r for r in data.get('results', []) if r['issue_severity'] in ['HIGH', 'CRITICAL']]; print(f'Found {len(high_crit)} HIGH/CRITICAL issues'); exit(1 if len(high_crit) > 0 else 0)"
          fi
      
      - name: Run Safety dependency scan
        run: |
          cd backend
          pip install -r requirements.txt
          safety check || echo "Safety scan completed with findings"
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: backend/security_reports/
