# Agent Assignment Rules for irStudy Medical Content Evaluation System
# Maps content types and specialties to expert agents
#
# Rule Structure:
# - Primary assignment: Based on content type + specialty
# - Secondary reviewers: Cross-validation agents
# - Minimum agents per item: 2-3 for quality assurance

version: "1.0.0"
last_updated: "2026-03-25"

