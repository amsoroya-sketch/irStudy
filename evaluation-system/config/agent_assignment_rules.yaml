# Assignment rules by content type
assignment_rules:

  # Patient Personas (OSCE simulation patients)
  patient_persona:
    primary_agents:
      - clinical-documentation-expert  # SOAP note structure, Australian standards
      - history-taking-expert  # 9-step history taking methodology

    secondary_agents_by_specialty:
      cardiology:
        - radiology-interpretation-expert  # ECG, CXR interpretation
        - medication-management-expert  # Cardiac medications (Australian names)

      respiratory:
        - radiology-interpretation-expert  # CXR, CT chest
        - medication-management-expert  # Bronchodilators, corticosteroids

      neurology:
        - radiology-interpretation-expert  # CT/MRI brain
        - physical-examination-expert  # Neurological examination

      psychiatry:
        - mental-health-crisis-expert  # Suicide risk, Mental Health Act

      paediatrics:
        - pediatric-emergency-expert  # APLS, weight-based dosing

      emergency:
        - procedural-skills-expert  # Emergency procedures
        - medication-management-expert  # Emergency medications

      palliative:
        - palliative-care-expert  # WHO analgesic ladder, end-of-life

      infectious_diseases:
        - infection-control-expert  # Hand hygiene, precautions
        - medication-management-expert  # Antimicrobial stewardship

      general_practice:
        - rural-medicine-expert  # Rural/remote medicine context
        - medication-management-expert  # Common medications

    minimum_agents: 3

  # MCQs (Multiple Choice Questions)
  mcq:
    # NOTE: Do NOT assign medication-management-expert as primary for ALL MCQs
    # It should only evaluate pharmacology/medication-specific MCQs
    # Diagnostic MCQs should be evaluated by specialty-specific experts only
    primary_agents: []  # No universal primary agent for MCQs

    secondary_agents_by_specialty:
      cardiology:
        - radiology-interpretation-expert  # ECG questions
        - medication-management-expert  # Only if MCQ tests cardiac medications

      respiratory:
        - radiology-interpretation-expert  # CXR questions
        - medication-management-expert  # Only if MCQ tests respiratory medications

      psychiatry:
        - mental-health-crisis-expert  # Primary for psychiatry MCQs (diagnosis, treatment, suicide risk)
        - medication-management-expert  # Only if MCQ tests psychiatric medication dosing/interactions

      paediatrics:
        - pediatric-emergency-expert
        - medication-management-expert  # Only if MCQ tests paediatric medication dosing

      pathology:
        - pathology-interpretation-expert  # FBC/UEC/LFT interpretation

      radiology:
        - radiology-interpretation-expert

      pharmacology:
        - medication-management-expert  # Primary for pure pharmacology MCQs

      infectious_diseases:
        - infection-control-expert
        - medication-management-expert  # Only if MCQ tests antimicrobial selection/dosing

      surgery:
        - surgical-skills-expert

    minimum_agents: 1  # Changed from 2 - specialty-specific expert is sufficient

  # OSCE Scripts (clinical exam scenarios)
  osce_script:
    primary_agents:
      - clinical-documentation-expert  # Clinical documentation standards
      - history-taking-expert  # History taking stations
      - physical-examination-expert  # Examination stations

    secondary_agents_by_specialty:
      cardiology:
        - radiology-interpretation-expert
        - medication-management-expert

      respiratory:
        - radiology-interpretation-expert
        - medication-management-expert

      psychiatry:
        - mental-health-crisis-expert

      paediatrics:
        - pediatric-emergency-expert

      emergency:
        - procedural-skills-expert

      palliative:
        - palliative-care-expert

      infectious_diseases:
        - infection-control-expert

      surgery:
        - surgical-skills-expert
        - procedural-skills-expert

    minimum_agents: 3

  # Study Cards (flashcard content)
  study_card:
    primary_agents:
      - medication-management-expert  # Drug names, dosing

    secondary_agents_by_specialty:
      cardiology:
        - radiology-interpretation-expert

      respiratory:
        - radiology-interpretation-expert

      psychiatry:
        - mental-health-crisis-expert

      paediatrics:
        - pediatric-emergency-expert

      pathology:
        - pathology-interpretation-expert

      infectious_diseases:
        - infection-control-expert

      palliative:
        - palliative-care-expert

    minimum_agents: 2

  # Clinical Images (radiology, dermatology, ophthalmology)
  clinical_image:
    primary_agents:
      - radiology-interpretation-expert  # All image interpretation

    secondary_agents_by_specialty:
      radiology:
        - radiology-interpretation-expert

      cardiology:
        - radiology-interpretation-expert  # ECG, CXR, echo

      respiratory:
        - radiology-interpretation-expert  # CXR, CT chest

      neurology:
        - radiology-interpretation-expert  # CT/MRI brain

    minimum_agents: 1

