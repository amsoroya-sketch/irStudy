# Evaluation criteria (used by agents during review)
evaluation_criteria:
  australian_standards:
    weight: 0.25
    description: "Compliance with Australian medical standards (AMC, AHPRA, RACGP)"
    checks:
      - Australian drug names (paracetamol, not acetaminophen)
      - Australian terminology (GP, not PCP)
      - Australian guidelines (eTG, AMH, PBS)
      - Australian units (mmol/L, not mg/dL for glucose)

  clinical_accuracy:
    weight: 0.30
    description: "Medical accuracy and evidence-based practice"
    checks:
      - Correct diagnoses and differentials
      - Evidence-based management
      - Appropriate investigations
      - Safe prescribing practices

  educational_alignment:
    weight: 0.20
    description: "Alignment with AMC Clinical Exam blueprint"
    checks:
      - AMC Part 1/2 content coverage
      - OSCE station format compliance
      - Appropriate difficulty level
      - Clear learning objectives

  rag_citation_quality:
    weight: 0.15
    description: "RAG citation accuracy and traceability"
    checks:
      - All facts have qdrant_point_id
      - Citations confidence ≥0.65
      - No hallucinated citations
      - Australian sources ≥60%

  cultural_safety:
    weight: 0.10
    description: "Aboriginal/TSI, LGBTQIA+, CALD representation"
    checks:
      - Appropriate cultural representation
      - No stereotyping or bias
      - Inclusive language
      - Trauma-informed approach

# Scoring thresholds
scoring_thresholds:
  excellent: 9.0  # Deployment-ready
  good: 8.0       # Minor revisions needed
  acceptable: 7.0 # Moderate revisions needed
  poor: 6.0       # Major revisions needed
  failing: 0.0    # Reject, complete rewrite
