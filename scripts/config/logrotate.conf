# Logrotate configuration for Medical Resources Audit Logs
# HIPAA Compliance: 6-year retention period
#
# Installation:
#   sudo cp scripts/config/logrotate.conf /etc/logrotate.d/medical-resources
#   sudo chmod 644 /etc/logrotate.d/medical-resources
#
# Test configuration:
#   sudo logrotate -d /etc/logrotate.d/medical-resources
#
# Force rotation (testing):
#   sudo logrotate -f /etc/logrotate.d/medical-resources

# Audit logs (HIPAA - 6 year retention)
/var/log/medical_resources/audit_*.jsonl {
    monthly
    rotate 72              # 72 months = 6 years
    compress
    delaycompress          # Don't compress current month
    notifempty
    create 0600 dev dev    # Replace 'dev' with actual user
    missingok
    sharedscripts

    # Don't rotate if empty
    minsize 1k

    # Compress old logs
    compresscmd /bin/gzip
    compressext .gz
    compressoptions -9     # Maximum compression

    # Post-rotation script (optional)
    postrotate
        # Send notification email when logs are rotated
        # echo "Audit logs rotated on $(date)" | mail -s "Medical Resources Audit Log Rotation" admin@example.com
    endscript
}

# Application logs (shorter retention - 1 year)
/mnt/data/medical_resources/logs/*.log {
    weekly
    rotate 52              # 52 weeks = 1 year
    compress
    delaycompress
    notifempty
    create 0640 dev dev
    missingok
    sharedscripts
}

# State files (keep 12 backups)
/mnt/data/medical_resources/weekly_update_state.json.backup.* {
    # Don't rotate - state_manager.py handles this
    # Just document that state_manager keeps 5 backups
}
