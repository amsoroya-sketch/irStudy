name: Security Scan

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**/*.py'
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'mobile/**/*.dart'
      - '**/*.env*'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Scan for hardcoded Anthropic API keys
      run: |
        echo "Scanning for hardcoded Anthropic API keys..."
        if grep -r "sk-ant-" . \
          --exclude-dir=node_modules \
          --exclude-dir=.next \
          --exclude-dir=venv \
          --exclude-dir=.git \
          --exclude-dir=build \
          --exclude-dir=dist \
          --include="*.py" \
          --include="*.ts" \
          --include="*.tsx" \
          --include="*.dart" \
          --include="*.js" \
          --include="*.json"; then
          echo "❌ Found hardcoded Anthropic API keys (sk-ant-*)"
          exit 1
        else
          echo "✅ No hardcoded Anthropic API keys found"
        fi

    - name: Scan for generic API keys and secrets
      run: |
        echo "Scanning for generic API keys and secrets..."
        if grep -r "api_key\s*=\s*['\"]" . \
          --exclude-dir=node_modules \
          --exclude-dir=.next \
          --exclude-dir=venv \
          --exclude-dir=.git \
          --exclude-dir=build \
          --exclude-dir=dist \
          --include="*.py" \
          --include="*.ts" \
          --include="*.tsx" \
          --include="*.dart" \
          --include="*.js"; then
          echo "❌ Found hardcoded api_key assignments"
          exit 1
        else
          echo "✅ No hardcoded api_key assignments found"
        fi

    - name: Scan for database credentials
      run: |
        echo "Scanning for hardcoded database credentials..."
        if grep -r "dbPath:\|dbKey:\|userId.*mock" . \
          --exclude-dir=node_modules \
          --exclude-dir=.next \
          --exclude-dir=venv \
          --exclude-dir=.git \
          --exclude-dir=build \
          --exclude-dir=dist \
          --exclude-dir=test \
          --exclude-dir=tests \
          --include="*.py" \
          --include="*.dart" \
          --include="*.ts" \
          --include="*.tsx"; then
          echo "❌ Found potential hardcoded database credentials"
          exit 1
        else
          echo "✅ No hardcoded database credentials found"
        fi

    - name: Scan for hardcoded URLs (development/localhost)
      run: |
        echo "Scanning for hardcoded localhost URLs..."
        if grep -r "http://localhost:\|ws://localhost:" . \
          --exclude-dir=node_modules \
          --exclude-dir=.next \
          --exclude-dir=venv \
          --exclude-dir=.git \
          --exclude-dir=build \
          --exclude-dir=dist \
          --exclude-dir=test \
          --exclude-dir=tests \
          --exclude-dir=.github \
          --include="*.py" \
          --include="*.ts" \
          --include="*.tsx" \
          --include="*.dart" | grep -v "process.env\|os.getenv\|const.*=.*||"; then
          echo "⚠️  Found hardcoded localhost URLs (may be acceptable in development configs)"
          echo "Review these manually to ensure they're in config files, not application code"
          # Don't fail on localhost (common in dev configs), but warn
        else
          echo "✅ No problematic hardcoded URLs found"
        fi

    - name: Scan for PHI in logs
      run: |
        echo "Scanning for potential PHI in log statements..."
        if grep -r "log.*MRN\|log.*DOB\|log.*email.*@\|console.log.*patient\.email" . \
          --exclude-dir=node_modules \
          --exclude-dir=.next \
          --exclude-dir=venv \
          --exclude-dir=.git \
          --exclude-dir=build \
          --exclude-dir=dist \
          --include="*.py" \
          --include="*.ts" \
          --include="*.tsx" \
          --include="*.dart"; then
          echo "❌ Found potential PHI in log statements"
          exit 1
        else
          echo "✅ No PHI detected in log statements"
        fi

    - name: Check for .env files in repository
      run: |
        echo "Checking for committed .env files..."
        if find . -name ".env" -o -name ".env.local" -o -name ".env.production" | grep -v ".env.example"; then
          echo "❌ Found .env files in repository - these should be gitignored"
          exit 1
        else
          echo "✅ No .env files found in repository"
        fi

    - name: Security Scan Summary
      if: success()
      run: |
        echo "======================================"
        echo "🔒 Security Scan Complete"
        echo "======================================"
        echo "✅ No hardcoded API keys found"
        echo "✅ No hardcoded credentials found"
        echo "✅ No PHI in logs found"
        echo "✅ No .env files committed"
        echo "======================================"
