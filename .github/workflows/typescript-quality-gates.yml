name: TypeScript Quality Gates

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/typescript-quality-gates.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**/*.ts'
      - 'frontend/**/*.tsx'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:   # allows manual runs, incl. the full-stack E2E job below

jobs:
  typescript-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: TypeScript Compilation Check
      run: |
        cd frontend
        if npx tsc --noEmit; then
          echo "✅ TypeScript compilation successful - 0 errors"
        else
          echo "❌ TypeScript compilation failed"
          exit 1
        fi

    - name: Run ESLint
      run: |
        cd frontend
        if npm run lint; then
          echo "✅ ESLint passed - 0 errors"
        else
          echo "❌ ESLint failed"
          exit 1
        fi

    - name: Unit + accessibility tests with coverage gate
      run: |
        cd frontend
        # `test:cov` runs the full Vitest suite (incl. the jest-axe accessibility
        # assertions embedded in the specs) AND enforces the >=70% coverage
        # thresholds declared in vitest.config.ts. Fails on any test failure,
        # any axe violation, or coverage below threshold.
        if npm run test:cov; then
          echo "✅ Tests + a11y passed and coverage >= 70%"
        else
          echo "❌ Tests failed, an accessibility violation was found, or coverage < 70%"
          exit 1
        fi

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: frontend/coverage/
        retention-days: 7

    - name: Build check
      run: |
        cd frontend
        if npm run build; then
          echo "✅ Build successful"
        else
          echo "❌ Build failed"
          exit 1
        fi

  # Full-stack Playwright E2E + visual snapshots. Requires a running backend
  # (:8001) with a seeded student user and DB — so it is MANUAL-ONLY
  # (workflow_dispatch) for now; wire the backend service stack here when
  # available, then flip it to run on PRs. Playwright auto-starts the Vite dev
  # server (:5173) via the `webServer` block in playwright.config.ts.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL || 'student@test.com' }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      VITE_API_URL: http://localhost:8001/api/v1
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: cd frontend && npm ci

    - name: Install Playwright browsers
      run: cd frontend && npx playwright install --with-deps chromium

    # TODO: start the backend (:8001) + Postgres/Vault services and seed the
    # student user here before running E2E. Until then this job is manual-only.
    - name: Run Playwright E2E + visual
      run: cd frontend && npm run test:e2e

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
        retention-days: 7
